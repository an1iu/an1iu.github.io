<div class="masthead">
  <div class="masthead__inner-wrap">
    <a class="skip-link" href="#main" target="_self">Skip to content</a>
    <nav class="profile-nav" aria-label="Main navigation">
        <a class="profile-nav__brand" href="{{ '/' | relative_url }}" target="_self" aria-label="An Liu, home">An Liu</a>
        <ul class="profile-nav__links">
          {% for link in site.data.navigation.main offset:1 %}
            <li class="masthead__menu-item"><a href="{{ domain }}{{ link.url }}" target="_self">{{ link.title }}</a></li>
          {% endfor %}
        </ul>
    </nav>
  </div>
</div>
